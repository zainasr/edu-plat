name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Install pinned tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generated code is up to date
        run: |
          make gen
          # Any modified or new file under services/api means the committed generated code is stale.
          # This covers every module's gen folder, including ones added later.
          if [ -n "$(git status --porcelain -- services/api)" ]; then
            git status --short -- services/api
            echo "Generated code is stale: run 'make gen' and commit the result."
            exit 1
          fi
      - name: Database roles and migrations
        run: |
          psql "postgresql://app:app@localhost:5432/app_dev" -v ON_ERROR_STOP=1 -f deploy/db/roles.sql
          make migrate
      - name: Checks (lint, vet, unit and integration tests)
        run: make check
