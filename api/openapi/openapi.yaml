openapi: 3.0.3
info:
  title: Education Platform API
  version: 0.12.0
  description: Source of truth for every capability (DEC-004). Edit this first, then the code.
# Infrastructure endpoints (health) sit at the root for the load balancer.
# Product endpoints carry their version in the path, for example /api/v1/students.
servers:
  - url: /

tags:
  - name: system
  - name: auth
  - name: tokens
  - name: students
  - name: structure
  - name: ledger
  - name: fees
  - name: staff
  - name: payments
  - name: calendar
  - name: attendance

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a one-time code to a mobile number
      description: Always answers 202 for a well-formed number, so the response does not reveal which numbers are registered (REQ-IAM-010).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "202":
          description: Code issued (if the number is known)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpRequested" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Exchange a one-time code for a session token in one tenant
      description: |
        The session belongs to one tenant (tenant_slug). The caller must be a member
        of that tenant. Failures return the same error, so a wrong code, an unknown
        number and a non-member look identical (US-IAM-003).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerify" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "423": { $ref: "#/components/responses/OtpLocked" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/tokens:
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a personal access token for scripts and terminal use
      description: The token value is returned once. Only its hash is stored (REQ-IAM-015).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students:
    post:
      operationId: createStudent
      tags: [students]
      summary: Enrol a student with at least one guardian
      description: |
        Requires `student.create`. A guardian whose mobile already exists in the
        tenant joins that guardian's family (REQ-STU-004). Exactly one guardian is
        `primary`; when no guardian is `fee_payer`, the primary pays (BR-STU-006).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentCreate" }
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listStudents
      tags: [students]
      summary: List students in the caller's tenant (cursor paginated)
      description: Requires `student.view`. Results are ordered newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Read one student with guardians
      description: Requires `student.view`. A student outside the caller's tenant returns 404, never 403 (API conventions §3).
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/change-section:
    post:
      operationId: changeStudentSection
      tags: [students]
      summary: Move a student to another section, keeping history
      description: |
        Requires `student.edit`. Closes the current enrolment and opens a new one in the
        target section, recording the reason (US-STU-005, REQ-STU-008). Attendance and other
        history stay with the student. Moving to the same section, or to an archived one, is refused.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSection" }
      responses:
        "200":
          description: The student with the new enrolment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/enrolments:
    get:
      operationId: listStudentEnrolments
      tags: [students]
      summary: The enrolment history of one student, newest first
      description: Requires `student.view`. Every class, section or shift change is an entry (REQ-STU-008).
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sessions:
    post:
      operationId: createSession
      tags: [structure]
      summary: Create an academic session (year)
      description: |
        Requires `session.manage`. The first session of a branch becomes current. Later sessions
        are created not current; switch with make-current (BR-ORG-001, REQ-ORG-006).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSessionCreate" }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listSessions
      tags: [structure]
      summary: List the sessions of the tenant's branch, newest first
      description: Requires `org.view`.
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSessionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sessions/{sessionId}/make-current:
    post:
      operationId: makeSessionCurrent
      tags: [structure]
      summary: Make this session the current one
      description: Requires `session.manage`. The previous current session stops being current in the same transaction (BR-ORG-001).
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The session, now current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/classes:
    post:
      operationId: createClass
      tags: [structure]
      summary: Create a class (for example Class 5)
      description: Requires `org.manage`. The grade level orders classes and maps promotions (REQ-ORG-008).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassCreate" }
      responses:
        "201":
          description: Class created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listClasses
      tags: [structure]
      summary: List the classes, ordered by grade level
      description: Requires `org.view`.
      responses:
        "200":
          description: The classes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/classes/{classId}/archive:
    post:
      operationId: archiveClass
      tags: [structure]
      summary: Archive a class; it is never deleted
      description: Requires `org.manage`. Business records are archived, not deleted (BR-ORG-003, DEC-011). New enrolments into its sections are refused.
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The archived class
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sections:
    post:
      operationId: createSection
      tags: [structure]
      summary: Create a section of a class, in a shift
      description: |
        Requires `org.manage`. A shift is a property of a section: "5-A Morning" and "5-A Evening"
        are different sections (REQ-ORG-005).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionCreate" }
      responses:
        "201":
          description: Section created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listSections
      tags: [structure]
      summary: List sections, optionally of one class
      description: Requires `org.view`.
      parameters:
        - name: class_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sections/{sectionId}/archive:
    post:
      operationId: archiveSection
      tags: [structure]
      summary: Archive a section; it is never deleted
      description: Requires `org.manage`. Students already enrolled stay enrolled; new enrolments are refused (BR-ORG-003).
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The archived section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts:
    get:
      operationId: listLedgerAccounts
      tags: [ledger]
      summary: List the school's ledger accounts
      description: |
        Requires `ledger.view`. The built-in chart is created the first time money is posted, so a
        school that has never posted money lists none.
      responses:
        "200":
          description: The accounts, ordered by code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerAccountList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/journal-entries:
    get:
      operationId: listJournalEntries
      tags: [ledger]
      summary: List journal entries, newest first
      description: |
        Requires `ledger.view`. There is no endpoint that creates or changes an entry: money is
        posted only by fee and accounting actions, and a correction is a reversing entry
        (DEC-011, DEC-016).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of entries with their lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/journal-entries/{entryId}:
    get:
      operationId: getJournalEntry
      tags: [ledger]
      summary: Read one journal entry with its lines
      description: Requires `ledger.view`. An entry outside the caller's tenant is a 404.
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/reports/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [ledger]
      summary: Debit and credit totals per account up to a date
      description: |
        Requires `report.finance.view`. Total debits always equal total credits when the ledger is
        sound; `balanced` shows it so a person can see it.
      parameters:
        - name: as_of
          in: query
          required: false
          description: Include entries dated on or before this day. Defaults to today (Asia/Karachi).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The trial balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalance" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-types:
    post:
      operationId: createFeeType
      tags: [fees]
      summary: Add a fee type (a head such as Tuition or Transport)
      description: Requires `fee.settings`. Fee types are archived, never deleted (DEC-011).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeTypeCreate" }
      responses:
        "201":
          description: Fee type created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeType" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listFeeTypes
      tags: [fees]
      summary: List fee types, creating the suggested set the first time
      description: |
        Requires `fee.view`. A school starts with suggested types (Tuition, Admission, Registration,
        Annual, Transport, Security Deposit). They are suggestions, never locks: archive what you do
        not use. An archived suggestion is not recreated.
      responses:
        "200":
          description: The fee types, ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeTypeList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-types/{feeTypeId}/archive:
    post:
      operationId: archiveFeeType
      tags: [fees]
      summary: Archive a fee type
      description: |
        Requires `fee.settings`. An archived type cannot be added to a plan and drops out of the
        fee structure from now on; past plan versions and released challans keep it.
      parameters:
        - name: feeTypeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The archived fee type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeType" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-plans/{classId}/lines:
    post:
      operationId: setFeePlanLine
      tags: [fees]
      summary: Set (or remove) one fee type on a class plan, from a month
      description: |
        Requires `fee.plan.manage`. This adds a new effective-dated version; the previous version
        stays, so history is exact and a released challan is never altered (BR-FEE-001).
        Setting the same fee type for the same month twice is a 409: choose a later month.
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanLineSet" }
      responses:
        "201":
          description: The version that was added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLine" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-plans/{classId}:
    get:
      operationId: getFeePlan
      tags: [fees]
      summary: The class plan as it stands in a month
      description: |
        Requires `fee.view`. For each fee type, the latest version on or before the month, leaving
        out types that were removed or archived.
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          description: Any date in the month. Defaults to the current month (Asia/Karachi).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The plan for that month
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeePlan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-plans/{classId}/history:
    get:
      operationId: getFeePlanHistory
      tags: [fees]
      summary: Every version ever set on a class plan, newest first
      description: Requires `fee.view`. Plan changes are audited and never overwrite earlier versions (REQ-FEE-001).
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: All versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLineList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/fee-overrides:
    post:
      operationId: setFeeOverride
      tags: [fees]
      summary: Set (or clear) one student's amount for a fee type, from a month
      description: |
        Requires `fee.plan.manage`. The fee type must be on the student's class plan in that month.
        A zero amount is allowed (a full concession). Like plan lines, this adds a version.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideSet" }
      responses:
        "201":
          description: The version that was added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeOverride" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listFeeOverrides
      tags: [fees]
      summary: Every override version set for a student, newest first
      description: Requires `fee.view`.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeOverrideList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/fee-structure:
    get:
      operationId: getFeeStructure
      tags: [fees]
      summary: What this student is charged for a month
      description: |
        Requires `fee.view`. The student's class plan for the month, with the student's overrides on
        top. Each line carries its frequency; challan generation decides which lines fall due.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          description: Any date in the month. Defaults to the current month (Asia/Karachi).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The fee structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeStructure" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/generate:
    post:
      operationId: generateChallans
      tags: [fees]
      summary: Draft the month's challans for every billable student (or preview them)
      description: |
        Requires `fee.generate`. For each student with an active enrolment, builds a draft challan from
        the fee structure for `month`: monthly lines always, one-time lines in the month of the student's
        first enrolment, annual lines in the month of year the plan line first took effect, ad hoc lines
        never. A student who already has a non-void challan for the month is skipped ("has_challan"), so
        running it again is safe. With `dry_run` nothing is written and each student shows whether a
        challan "will_generate". Drafts post nothing to the ledger; release does.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateChallans" }
      responses:
        "200":
          description: What was (or would be) generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateChallansResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/release:
    post:
      operationId: releaseChallans
      tags: [fees]
      summary: Release draft challans in bulk
      description: |
        Requires `fee.release`. All or nothing. Each challan gets a gapless challan number and a consumer
        number, becomes read-only for ever (BR-FEE-001), and posts its receivable in the same transaction:
        debit Fee Receivable, credit Fee Income (BR-FEE-008). A challan that is not a draft makes the
        whole request fail with `challans.not_draft`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseChallans" }
      responses:
        "200":
          description: The released challans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallanList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans:
    get:
      operationId: listChallans
      tags: [fees]
      summary: List challans (cursor paginated, newest first)
      description: Requires `fee.view`.
      parameters:
        - name: month
          in: query
          required: false
          description: Any date in the month to list.
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ChallanStatus" }
        - name: student_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of challans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallanPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/{challanId}:
    get:
      operationId: getChallan
      tags: [fees]
      summary: One challan with its lines
      description: Requires `fee.view`.
      parameters:
        - name: challanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The challan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/{challanId}/void:
    post:
      operationId: voidChallan
      tags: [fees]
      summary: Void a draft challan
      description: |
        Requires `fee.generate`. Drafts only; the student can then be generated again. A released
        challan is never edited or voided here (BR-FEE-001): its void is a ledger reversal and comes
        with payments.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: challanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoidChallan" }
      responses:
        "200":
          description: The voided challan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [staff]
      summary: The built-in roles and the permissions each one grants
      description: Requires `user.view`.
      responses:
        "200":
          description: The roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff:
    post:
      operationId: createStaff
      tags: [staff]
      summary: Add a staff member to the school
      description: |
        Requires `user.manage` and, because it gives roles, `role.manage`; giving the `owner` role also needs the caller to be an owner. The person is
        identified by mobile number. If that number already belongs to someone (even in another school) the
        same person is added here, and nothing in the response says so. The name given is this school's
        name for them. Starting roles are required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreate" }
      responses:
        "201":
          description: The staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listStaff
      tags: [staff]
      summary: List the school's staff
      description: Requires `user.view`. Ordered by name.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/StaffStatus" }
      responses:
        "200":
          description: The staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}:
    get:
      operationId: getStaff
      tags: [staff]
      summary: One staff member with their current roles
      description: Requires `user.view`.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/roles:
    post:
      operationId: assignRole
      tags: [staff]
      summary: Give a staff member a role
      description: |
        Requires `role.manage`; the `owner` role can be given only by an owner. A person may hold many
        roles and their permissions are the union (REQ-IAM-002). Giving a role they already hold is a 409.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAssign" }
      responses:
        "200":
          description: The staff member with the new role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/roles/{role}/revoke:
    post:
      operationId: revokeRole
      tags: [staff]
      summary: Take a role away from a staff member
      description: |
        Requires `role.manage`; the `owner` role can be revoked only by an owner, and never from the last
        owner (`staff.last_owner`). The assignment is kept as history (REQ-IAM-006). Taking a person's last role
        switches them off, as deactivation does (REQ-IAM-006); it cannot be your own last role.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
        - name: role
          in: path
          required: true
          schema: { $ref: "#/components/schemas/RoleName" }
      responses:
        "200":
          description: The staff member without that role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/deactivate:
    post:
      operationId: deactivateStaff
      tags: [staff]
      summary: Switch a staff member off
      description: |
        Requires `user.manage` (an owner is switched off only by an owner). Access ends on their next request and their tokens are revoked; their
        history stays (US-IAM-005). You cannot deactivate yourself, nor the last owner.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The deactivated staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/reactivate:
    post:
      operationId: reactivateStaff
      tags: [staff]
      summary: Switch a deactivated staff member back on
      description: |
        Requires `user.manage`. Their roles are as they were; they sign in again, since their old tokens
        stay revoked.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/payments:
    post:
      operationId: recordPayment
      tags: [payments]
      summary: Take a payment from a family at the counter
      description: |
        Requires `fee.collect`. The `Idempotency-Key` header is REQUIRED here (400 `idempotency.key_required`
        without it): a retry after a lost response must never take the money twice. The amount is split across
        the family's released challans oldest first (by due date), unless `allocations` names how; either way the
        parts add up to the amount. A payment above what the family owes is refused with
        `payments.exceeds_dues` unless `hold_excess_as_advance` is set; the extra is then held as Advance. The payment posts debit Cash in Hand or Bank, credit Fee
        Receivable, in the same transaction, and gets the next gapless receipt number of the fiscal year
        (July to June, named by the starting year): `RCP-2026-000001`. One payment is one receipt, with a line per
        child.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCreate" }
      responses:
        "201":
          description: The payment and its receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments (cursor paginated, newest first)
      description: Requires `fee.view`. Voided payments are included; filter with `status`.
      parameters:
        - name: family_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PaymentStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of payments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/payments/{paymentId}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: One payment with its receipt number and allocations
      description: Requires `fee.view`.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/payments/{paymentId}/void:
    post:
      operationId: voidPayment
      tags: [payments]
      summary: Void a payment
      description: |
        Requires `payment.void`. Keeps the receipt number (marked voided), posts a reversing journal entry in
        the same transaction, and reopens the challans it paid (their balances are worked out from the
        payments that stand). Nothing is deleted (BR-FEE-003). A payment can be voided once.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentVoid" }
      responses:
        "200":
          description: The voided payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/families/{familyId}/dues:
    get:
      operationId: getFamilyDues
      tags: [payments]
      summary: What a family owes now, challan by challan, oldest first
      description: Requires `fee.view`. Released challans with a balance above zero, in the order a payment would pay them.
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The family's dues
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyDues" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/payments/{paymentId}/refund:
    post:
      operationId: refundAdvance
      tags: [payments]
      summary: Pay back advance that has not been applied
      description: |
        Requires `fee.refund`. Takes money out of the unapplied advance of one payment (DEC-010: money that
        cannot be applied must be refunded explicitly): debit Advance Fees Received, credit Cash in Hand or
        Bank, in the same transaction. A refund cannot exceed what is still held, and cannot be undone here.
        Audited with the reason. A payment whose advance has been applied or refunded can no longer be voided.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvanceRefundCreate" }
      responses:
        "200":
          description: The payment, with the refund listed and its advance updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/defaulters:
    get:
      operationId: listDefaulters
      tags: [payments]
      summary: Families that are 30 or more days overdue (configurable), most overdue first
      description: |
        Requires `fee.view`. A family appears when it has a released challan with a balance whose due date is at
        least `min_days` days ago (default 30, REQ-FEE-041). Each entry has the overdue total, the oldest due
        date, the overdue challans, and the fee payer's name and mobile for the call list (REQ-FEE-042). Nothing
        is stored: it is worked out from the challans and payments as they stand.
      parameters:
        - name: min_days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of defaulting families
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefaulterPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/calendar:
    get:
      operationId: getCalendar
      tags: [calendar]
      summary: "The school calendar: weekly off days and the listed days in a date range"
      description: |
        Requires `org.view`. A day is a school day unless it is a weekly off day or a listed holiday; a listed
        `working` day makes a weekly off day a school day (REQ-ORG-011). Holidays suppress attendance.
      parameters:
        - name: from
          in: query
          required: false
          description: Defaults to the first day of the current month (Asia/Karachi).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Defaults to the last day of the month of `from`. At most 366 days.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The calendar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/calendar/weekly-off:
    put:
      operationId: setWeeklyOff
      tags: [calendar]
      summary: Set the weekly off days
      description: Requires `calendar.manage`. Days are numbered 0 (Sunday) to 6 (Saturday). Defaults to Sunday.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeeklyOffSet" }
      responses:
        "200":
          description: The calendar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/calendar/days:
    post:
      operationId: addCalendarDays
      tags: [calendar]
      summary: Add a holiday or a special working day, for one date or a range
      description: |
        Requires `calendar.manage`. One row is kept per date, up to 60 dates at once. A date that already has an
        active entry is a 409 `calendar.day_exists`: remove the old entry first. Registers already opened on a
        date are kept as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarDaysCreate" }
      responses:
        "201":
          description: The days added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDayList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/calendar/days/{dayId}/remove:
    post:
      operationId: removeCalendarDay
      tags: [calendar]
      summary: Remove a holiday or working day from the calendar
      description: Requires `calendar.manage`. The entry is kept as history (never deleted) and stops counting.
      parameters:
        - name: dayId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The removed entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDay" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/settings:
    get:
      operationId: getAttendanceSettings
      tags: [attendance]
      summary: The school's attendance settings
      description: Requires `attendance.view`. Created with defaults on first use.
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: setAttendanceSettings
      tags: [attendance]
      summary: Change the attendance settings
      description: Requires `attendance.settings`. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceSettings" }
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSettings" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/registers:
    post:
      operationId: openRegister
      tags: [attendance]
      summary: Open the register of a section for a date (or return it if it is already open)
      description: |
        Requires `attendance.mark`. The register opens with every student enrolled in the section on that date
        marked present, so only the exceptions need changing (REQ-ATT-015). Safe to call twice. Refused on a
        holiday or weekly off day (`attendance.not_school_day`), for a future date, and for a date older than the
        correction window unless the caller has `attendance.edit_any`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterOpen" }
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Register" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listRegisters
      tags: [attendance]
      summary: The registers opened for a date, without their records
      description: Requires `attendance.view`.
      parameters:
        - name: date
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The registers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/registers/{registerId}:
    get:
      operationId: getRegister
      tags: [attendance]
      summary: One register with every student's current status
      description: Requires `attendance.view`.
      parameters:
        - name: registerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Register" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/registers/{registerId}/records:
    put:
      operationId: markRecords
      tags: [attendance]
      summary: Change students' statuses in an open register
      description: |
        Requires `attendance.mark`. Only while the register is open (a submitted register changes only by a
        correction with a reason), only on a school day, and, for a register older than the correction window,
        only with `attendance.edit_any`. A mark that equals the current status changes nothing. Every change keeps the
        old value as history (BR-ATT-002).
      parameters:
        - name: registerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordsMark" }
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Register" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/registers/{registerId}/submit:
    post:
      operationId: submitRegister
      tags: [attendance]
      summary: Submit the register
      description: |
        Requires `attendance.mark`. Once. On submit, students who joined the section that day and were not marked
        are recorded present, and students who are no longer enrolled in it (moved or withdrew) are recorded as
        `left` and not counted. Only submitted registers feed the absent list, the reports and the parent
        alerts; a register that is never submitted is never treated as all-absent (BR-ATT-005).
      parameters:
        - name: registerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The submitted register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Register" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/registers/{registerId}/corrections:
    post:
      operationId: correctRecord
      tags: [attendance]
      summary: Correct one student's status in a submitted register
      description: |
        Requires `attendance.edit_within_window` for dates within the correction window (default 7 days), or
        `attendance.edit_any` for older dates. A reason is required. The old value, new value, who, when and why
        are kept (US-ATT-005). Only a submitted register is corrected; an open one is simply marked.
      parameters:
        - name: registerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCorrection" }
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Register" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/missing-registers:
    get:
      operationId: listMissingRegisters
      tags: [attendance]
      summary: Sections with no submitted register once the due time has passed
      description: |
        Requires `attendance.view`. For today, empty until the school's register due time (default 10:00); for
        a past school day, every section without a submitted register (US-ATT-008). Holidays have none.
      parameters:
        - name: date
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The missing registers
          content:
            application/json:
