      operationId: getStudentAttendance
      tags: [attendance]
      summary: One student's attendance over a period
      description: Requires `attendance.view`. Days come from submitted registers; `corrected` marks days that were changed after submission.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The student's attendance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentAttendance" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/cards:
    post:
      operationId: issueStudentCard
      tags: [attendance]
      summary: Issue the student's ID card
      description: |
        Requires `student.edit`. Creates the card whose QR code is scanned at the gate. A student has one active
        card: issuing a new one disables the old one in the same step, so a lost card stops working at once.
        The code is signed with the school's secret and is the same every time, so a card can be reprinted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The new card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentCard" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listStudentCards
      tags: [attendance]
      summary: The student's cards, newest first
      description: Requires `student.edit`. The code is shown only for the active card.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentCardList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/student-cards/{cardId}/disable:
    post:
      operationId: disableStudentCard
      tags: [attendance]
      summary: Disable a card (lost, stolen, replaced)
      description: Requires `student.edit`. Disabled at once; a scan of it marks nothing. Kept as history.
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardDisable" }
      responses:
        "200":
          description: The disabled card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentCard" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/scan:
    post:
      operationId: scanCard
      tags: [attendance]
      summary: Record a student's arrival from a scanned card
      description: |
        Requires `attendance.scan`; every scan is stored with the signed-in user (BR-ATT-006). The code is checked
        for its signature before anything is looked up. A good scan records the arrival as `present`, or `late`
        after the shift's start plus its grace. A second scan of the same student within 2 minutes is ignored
        (`outcome: duplicate`). An offline computer sends the time it scanned and a `client_scan_id`; sending the
        same id again returns the same result and adds nothing. A forged or unknown code is 404
        `attendance.card_invalid`; a disabled card is 409 `attendance.card_disabled`; a day that is not a school
        day is 409 `attendance.not_school_day`; a student not enrolled in a section that day is 409
        `attendance.not_enrolled`. Nothing is marked in any of those cases. The class register is not changed:
        the arrival shows beside it, and disagreements are listed under mismatches (REQ-ATT-017).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanCreate" }
      responses:
        "200":
          description: The scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/gate-scans:
    get:
      operationId: listGateScans
      tags: [attendance]
      summary: The gate scans of a day
      description: Requires `attendance.view`. Oldest first. `is_arrival` marks each student's first scan of the day.
      parameters:
        - name: date
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The scans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateScanList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/mismatches:
    get:
      operationId: listAttendanceMismatches
      tags: [attendance]
      summary: Where the gate and the class register disagree
      description: |
        Requires `attendance.view`. From submitted registers only. `scanned_but_absent`: scanned at the gate but
        marked absent in class. `present_but_not_scanned`: marked present or late in class but never scanned,
        listed only for sections that had at least one scan that day, so a school or section that does not use
        the gate is not flooded. Nothing is changed automatically; an Admin reviews the list (REQ-ATT-017).
      parameters:
        - name: date
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The mismatches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MismatchList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-chosen unique string (8 to 128 characters: letters, digits, `.`, `_`, `:`, `-`) that makes
        a retry safe (REQ-API-010). The key belongs to the user who first sent it, for one endpoint and one
        exact request (path, query and body). A repeat of that request returns the original successful
        response (header `Idempotent-Replay: true`; only the status, body and Content-Type are replayed)
        and does nothing again. The same key with anything different, including another user, is refused
        with 422 `idempotency.key_reused`. While the first request is still running a repeat gets 409
        `idempotency.in_progress`. Only successful responses (below 400) are remembered, for 24 hours; an
        error frees the key so the same request can be retried. Optional for now; payments will require it.
      schema: { type: string, minLength: 8, maxLength: 128 }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token (from verify) or personal access token (from /tokens).

  responses:
    ValidationError:
      description: Request is malformed or breaks a rule
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: Missing, unknown, expired or revoked token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidCredentials:
      description: Wrong or expired code, or the mobile is not a member of the tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    OtpLocked:
      description: Too many wrong codes; wait for the cool-down
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Token lacks the named permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: The request clashes with existing data, for example a duplicate name
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    KeyReused:
      description: The Idempotency-Key was already used with a different request body or endpoint
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such resource in the caller's tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Unexpected failure; the request_id is in the body and the logs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: student.not_found }
            message: { type: string, example: Student not found. }
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: guardians }
                  message: { type: string, example: At least one guardian is required. }
            request_id: { type: string, example: 3f1c2a9e0b7d4c11 }

    Mobile:
      type: string
      description: Pakistani mobile, as 03XXXXXXXXX or +923XXXXXXXXX. Stored as E.164.
      pattern: "^(\\+92|0)3[0-9]{9}$"
      example: "03001234567"

    OtpRequest:
      type: object
      required: [mobile]
      additionalProperties: false
      properties:
        mobile: { $ref: "#/components/schemas/Mobile" }

    OtpRequested:
      type: object
      required: [expires_in_seconds]
      properties:
        expires_in_seconds: { type: integer, example: 300 }

    OtpVerify:
      type: object
      required: [mobile, code, tenant_slug]
      additionalProperties: false
      properties:
        mobile: { $ref: "#/components/schemas/Mobile" }
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "123456"
        tenant_slug:
          type: string
          pattern: "^[a-z0-9-]{3,40}$"
          example: demo-school

    Session:
      type: object
      required: [token, expires_at, tenant]
      properties:
        token:
          type: string
          example: edu_session_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        expires_at: { type: string, format: date-time }
        tenant:
          $ref: "#/components/schemas/TenantRef"

    TenantRef:
      type: object
      required: [id, slug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: demo-school }

    TokenCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: nightly-import
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90

    TokenCreated:
      type: object
      required: [id, name, token, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token:
          type: string
          description: Shown once. Store it now.
          example: edu_pat_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        expires_at: { type: string, format: date-time }

    Gender:
      type: string
      enum: [male, female, other]

    Relationship:
      type: string
      description: A guardian's relation to the student (REQ-STU-002).
      enum: [father, mother, grandfather, grandmother, uncle, aunt, brother, sister, other]

    GuardianAccess:
      type: string
      enum: [full, view_only, none]

    GuardianInput:
      type: object
      required: [full_name, mobile, relationship, primary]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        mobile: { $ref: "#/components/schemas/Mobile" }
        relationship: { $ref: "#/components/schemas/Relationship" }
        primary: { type: boolean, description: The family login. Exactly one guardian is primary. }
        fee_payer: { type: boolean, description: Challans are addressed to this guardian. Defaults to the primary. }
        receives_notifications: { type: boolean, default: true }
        emergency_contact: { type: boolean, default: false }
        access: { $ref: "#/components/schemas/GuardianAccess", default: full }

    StudentCreate:
      type: object
      required: [full_name, father_name, gender, date_of_birth, section_id, guardians]
      additionalProperties: false
      properties:
        section_id:
          type: string
          format: uuid
          description: The section to enrol in, in the branch's current session (REQ-STU-001).
        full_name: { type: string, minLength: 1, maxLength: 120, example: Ali Khan }
        father_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Identity field for certificates. May be "Not available". The father need not be a guardian (REQ-STU-014).
          example: Imran Khan
        gender: { $ref: "#/components/schemas/Gender" }
        date_of_birth: { type: string, format: date, example: "2018-04-12" }
        guardians:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/GuardianInput" }

    GuardianView:
      type: object
      required: [guardian_id, full_name, mobile, relationship, primary, fee_payer, receives_notifications, emergency_contact, access]
      properties:
        guardian_id: { type: string, format: uuid }
        full_name: { type: string }
        mobile: { type: string }
        relationship: { $ref: "#/components/schemas/Relationship" }
        primary: { type: boolean }
        fee_payer: { type: boolean }
        receives_notifications: { type: boolean }
        emergency_contact: { type: boolean }
        access: { $ref: "#/components/schemas/GuardianAccess" }

    Student:
      type: object
      required: [id, registration_no, full_name, father_name, gender, date_of_birth, status, family, enrolment, guardians, created_at]
      properties:
        id: { type: string, format: uuid }
        enrolment:
          nullable: true
          description: The current enrolment. Null for a student who has none yet (for example one created before sections existed).
          allOf:
            - $ref: "#/components/schemas/Enrolment"
        registration_no: { type: string, example: "REG-2026-00001" }
        full_name: { type: string }
        father_name: { type: string }
        gender: { $ref: "#/components/schemas/Gender" }
        date_of_birth: { type: string, format: date }
        status:
          type: string
          enum: [active]
        family:
          type: object
          required: [id, number]
          properties:
            id: { type: string, format: uuid }
            number: { type: string, example: "F-00001" }
        guardians:
          type: array
          items: { $ref: "#/components/schemas/GuardianView" }
        created_at: { type: string, format: date-time }

    StudentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Student" }
        next_cursor:
          type: string
          nullable: true
          description: Pass as ?cursor= to get the next page. Null on the last page.

    Shift:
      type: string
      description: A shift is a property of a section (REQ-ORG-005).
      enum: [morning, evening]

    AcademicSessionCreate:
      type: object
      required: [name, starts_on, ends_on]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40, example: "2026-27" }
        starts_on: { type: string, format: date, example: "2026-04-01" }
        ends_on: { type: string, format: date, example: "2027-03-31" }

    AcademicSession:
      type: object
      required: [id, name, starts_on, ends_on, is_current]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        is_current: { type: boolean }

    AcademicSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AcademicSession" }

    ClassCreate:
      type: object
      required: [name, grade_level]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40, example: "Class 5" }
        grade_level:
          type: integer
          minimum: 0
          maximum: 16
          description: Orders classes and maps promotions. 0 is early years.

    Class:
      type: object
      required: [id, name, grade_level, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grade_level: { type: integer }
        status: { type: string, enum: [active, archived] }

    ClassList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Class" }

    SectionCreate:
      type: object
      required: [class_id, name, shift]
      additionalProperties: false
      properties:
        class_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 20, example: A }
        shift: { $ref: "#/components/schemas/Shift" }

    Section:
      type: object
      required: [id, class_id, class_name, name, shift, status]
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        class_name: { type: string }
        name: { type: string }
        shift: { $ref: "#/components/schemas/Shift" }
        status: { type: string, enum: [active, archived] }

    SectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Section" }

    ChangeSection:
      type: object
      required: [section_id, reason]
      additionalProperties: false
      properties:
        section_id: { type: string, format: uuid }
        reason:
          type: string
          minLength: 3
          maxLength: 200
          example: correction

    Enrolment:
      type: object
      required: [id, session_id, session_name, section_id, class_name, section_name, shift, status, started_on]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        session_name: { type: string }
        section_id: { type: string, format: uuid }
        class_name: { type: string }
        section_name: { type: string }
        shift: { $ref: "#/components/schemas/Shift" }
        status: { type: string, enum: [active, closed] }
        started_on: { type: string, format: date }
        ended_on: { type: string, format: date, nullable: true }
        reason: { type: string, nullable: true, description: Why the student moved (set when an enrolment is closed by a move). }

    EnrolmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Enrolment" }

    Money:
      type: object
      description: An amount in minor units (paisa). Never a decimal or a float (API conventions §2).
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Whole paisa. 150000 is PKR 1,500.00.
          example: 150000
        currency: { type: string, enum: [PKR], example: PKR }

    LedgerAccount:
      type: object
      required: [id, code, name, type, system]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: "1200" }
        name: { type: string, example: Fee Receivable }
        type: { type: string, enum: [asset, liability, income, expense, equity] }
        system: { type: boolean, description: Built-in accounts cannot be removed. }

    LedgerAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LedgerAccount" }

    JournalLine:
      type: object
      required: [line_no, account_code, account_name, debit, credit]
      properties:
        line_no: { type: integer }
        account_code: { type: string }
        account_name: { type: string }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }

    JournalEntry:
      type: object
      required: [id, entry_no, occurred_on, memo, source_type, lines, created_at]
      properties:
        id: { type: string, format: uuid }
        entry_no: { type: integer, format: int64, description: Consecutive per school, no gaps. }
        occurred_on: { type: string, format: date }
        memo: { type: string }
        source_type: { type: string, example: challan.released }
        source_id: { type: string, format: uuid, nullable: true }
        reverses_entry_id:
          type: string
          format: uuid
          nullable: true
          description: Set when this entry reverses another.
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLine" }
        created_at: { type: string, format: date-time }

    JournalEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JournalEntry" }
        next_cursor: { type: string, nullable: true }

    TrialBalanceLine:
      type: object
      required: [account_code, account_name, account_type, debit, credit]
      properties:
        account_code: { type: string }
        account_name: { type: string }
        account_type: { type: string }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }

    TrialBalance:
      type: object
      required: [as_of, lines, total_debit, total_credit, balanced]
      properties:
        as_of: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/TrialBalanceLine" }
        total_debit: { $ref: "#/components/schemas/Money" }
        total_credit: { $ref: "#/components/schemas/Money" }
        balanced: { type: boolean }

    FeeKind:
      type: string
      description: What a fee type is for. `security_deposit` is held for the family and is never income (BR-FEE-004).
      enum: [tuition, admission, registration, annual, transport, lab, library, sports, fine, security_deposit, custom]

    FeeFrequency:
      type: string
      description: How often a plan line is charged. Quarterly and term are 1.1 (REQ-FEE-002).
      enum: [monthly, one_time, annual, ad_hoc]

    FeeTypeCreate:
      type: object
      required: [code, name, kind]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,29}$"
          description: A short stable key, unique in the school.
          example: lab_fee
        name: { type: string, minLength: 1, maxLength: 60, example: Lab Fee }
        kind: { $ref: "#/components/schemas/FeeKind" }

    FeeType:
      type: object
      required: [id, code, name, kind, is_deposit, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        is_deposit: { type: boolean, description: True only for security deposits. }
        status: { type: string, enum: [active, archived] }

    FeeTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeeType" }

    PlanLineSet:
      type: object
      required: [fee_type_id, effective_from]
      additionalProperties: false
      properties:
        fee_type_id: { type: string, format: uuid }
        effective_from:
          type: string
          format: date
          description: Any date in the month the change starts. It is stored as the first of that month.
        remove:
          type: boolean
          default: false
          description: Take this fee type off the plan from that month. No amount or frequency is sent.
        amount:
          $ref: "#/components/schemas/Money"
        frequency:
          $ref: "#/components/schemas/FeeFrequency"

    PlanLine:
      type: object
      required: [fee_type_id, fee_type_name, effective_from, removed]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        amount: { $ref: "#/components/schemas/Money" }
        frequency: { $ref: "#/components/schemas/FeeFrequency" }
        effective_from: { type: string, format: date }
        removed: { type: boolean }

    PlanLineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanLine" }

    FeePlan:
      type: object
      required: [class_id, month, lines]
      properties:
        class_id: { type: string, format: uuid }
        month: { type: string, format: date, description: The first day of the month asked for. }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PlanLine" }

    OverrideSet:
      type: object
      required: [fee_type_id, effective_from, reason]
      additionalProperties: false
      properties:
        fee_type_id: { type: string, format: uuid }
        effective_from: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 200, example: sibling concession }
        clear:
          type: boolean
          default: false
          description: Go back to the class plan amount from that month. No amount is sent.
        amount:
          $ref: "#/components/schemas/Money"

    FeeOverride:
      type: object
      required: [fee_type_id, fee_type_name, effective_from, cleared, reason, created_at]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        effective_from: { type: string, format: date }
        cleared: { type: boolean }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    FeeOverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeeOverride" }

    FeeLine:
      type: object
      required: [fee_type_id, fee_type_name, kind, amount, plan_amount, frequency, source]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        amount: { $ref: "#/components/schemas/Money" }
        plan_amount: { $ref: "#/components/schemas/Money" }
        frequency: { $ref: "#/components/schemas/FeeFrequency" }
        source:
          type: string
          enum: [plan, override]
          description: Where `amount` came from.

    FeeStructure:
      type: object
      required: [student_id, class_id, month, lines]
      properties:
        student_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        month: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/FeeLine" }

    ChallanStatus:
      type: string
      enum: [draft, released, void]

    GenerateChallans:
      type: object
      required: [month]
      properties:
        month:
          type: string
          format: date
          description: Any date in the month to bill.
        due_date:
          type: string
          format: date
          description: Defaults to the 10th of the month. Must not be before the month starts.
        dry_run:
          type: boolean
          default: false

    GenerateOutcome:
      type: string
      enum: [will_generate, generated, has_challan, nothing_to_bill]

    GenerateItem:
      type: object
      required: [student_id, student_name, registration_no, outcome, new_admission, total]
      properties:
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        registration_no: { type: string }
        outcome: { $ref: "#/components/schemas/GenerateOutcome" }
        new_admission:
          type: boolean
          description: True when the month is the student's first enrolment month (for the review exceptions list).
        total: { $ref: "#/components/schemas/Money" }
        challan_id: { type: string, format: uuid, nullable: true }

    GenerateChallansResult:
      type: object
      required: [month, due_date, dry_run, generated, items]
      properties:
        month: { type: string, format: date }
        due_date: { type: string, format: date }
        dry_run: { type: boolean }
        generated: { type: integer, description: Number of drafts written (0 for a dry run). }
        items:
          type: array
          items: { $ref: "#/components/schemas/GenerateItem" }

    ReleaseChallans:
      type: object
      required: [challan_ids]
      properties:
        challan_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }

    VoidChallan:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 300 }

    ChallanLine:
      type: object
      required: [fee_type_id, fee_type_name, kind, frequency, amount]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        frequency: { $ref: "#/components/schemas/FeeFrequency" }
        amount: { $ref: "#/components/schemas/Money" }

    Challan:
      type: object
      required: [id, student_id, family_id, month, due_date, status, new_admission, total, paid, balance, lines, created_at]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        month: { type: string, format: date }
        due_date: { type: string, format: date }
        status: { $ref: "#/components/schemas/ChallanStatus" }
        new_admission:
          type: boolean
          description: True when this is the month of the student's first enrolment. It marks an exception for the reviewer; it is worked out when the challan is read, not stored.
        total: { $ref: "#/components/schemas/Money" }
        paid: { $ref: "#/components/schemas/Money" }
        balance: { $ref: "#/components/schemas/Money" }
        payment_status:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentProgress"
        challan_no:
          type: integer
          format: int64
          nullable: true
          description: Gapless, set at release.
        consumer_no:
          type: string
          nullable: true
          description: 14 digits, set at release (ADR-0017).
        lines:
          type: array
          items: { $ref: "#/components/schemas/ChallanLine" }
        released_at: { type: string, format: date-time, nullable: true }
        void_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ChallanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Challan" }

    ChallanPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Challan" }
        next_cursor: { type: string, nullable: true }

    RoleName:
      type: string
      enum: [owner, accountant, receptionist, attendance_clerk]

    StaffStatus:
      type: string
      enum: [active, deactivated]

    RoleInfo:
      type: object
      required: [name, permissions]
      properties:
        name: { $ref: "#/components/schemas/RoleName" }
        permissions:
          type: array
          items: { type: string }

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoleInfo" }

    StaffCreate:
      type: object
      required: [mobile, full_name, roles]
      properties:
        mobile: { type: string, example: "03001234567" }
        full_name: { type: string, minLength: 1, maxLength: 80 }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RoleName" }

    RoleAssign:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/RoleName" }

    StaffMember:
      type: object
      required: [id, mobile, full_name, status, roles, created_at]
      properties:
        id: { type: string, format: uuid, description: The staff member's id in this school. }
        mobile: { type: string, description: In +92 form. }
        full_name: { type: string }
        status: { $ref: "#/components/schemas/StaffStatus" }
        roles:
          type: array
          description: Current roles only; revoked ones are in the audit log.
          items: { $ref: "#/components/schemas/RoleName" }
        created_at: { type: string, format: date-time }

    StaffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StaffMember" }

    PaymentMethod:
      type: string
      enum: [cash, bank_transfer, cheque]

    PaymentStatus:
      type: string
      enum: [recorded, voided]

    PaymentAccount:
      type: string
      description: The account the money is deposited to. 1000 is Cash in Hand, 1100 is Bank.
      enum: ["1000", "1100"]

    PaymentCreate:
      type: object
      required: [family_id, amount, method, account_code]
      properties:
        family_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        account_code: { $ref: "#/components/schemas/PaymentAccount" }
        received_on:
          type: string
          format: date
          description: Defaults to today in Pakistan. Cannot be in the future.
        reference:
          type: string
          maxLength: 100
          description: A cheque number, bank slip or transfer reference.
        hold_excess_as_advance:
          type: boolean
          default: false
          description: |
            Without this, a payment above what the family owes is refused (`payments.exceeds_dues`), so a typing
            slip cannot silently park money. With it, the extra is held as Advance and applied to the family's
            next challans when they are released (DEC-010).
        allocations:
          type: array
          description: Optional. How to split the amount across challans; must add up to the amount. Default is oldest first.
          items: { $ref: "#/components/schemas/AllocationInput" }

    AllocationInput:
      type: object
      required: [challan_id, amount]
      properties:
        challan_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }

    PaymentAllocation:
      type: object
      required: [challan_id, student_id, challan_no, amount]
      properties:
        challan_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        challan_no: { type: integer, format: int64 }
        amount: { $ref: "#/components/schemas/Money" }

    Payment:
      type: object
      required: [id, receipt_no, fiscal_year, family_id, amount, advance, advance_applied, advance_refunded, advance_available, method, account_code, received_on, status, allocations, refunds, entry_id, created_at]
      properties:
        id: { type: string, format: uuid }
        receipt_no: { type: string, example: RCP-2026-000001 }
        fiscal_year: { type: integer, description: The year the July to June fiscal year starts., example: 2026 }
        family_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        advance: { $ref: "#/components/schemas/Money" }
        advance_applied: { $ref: "#/components/schemas/Money" }
        advance_refunded: { $ref: "#/components/schemas/Money" }
        advance_available: { $ref: "#/components/schemas/Money" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        account_code: { $ref: "#/components/schemas/PaymentAccount" }
        reference: { type: string, nullable: true }
        received_on: { type: string, format: date }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/PaymentAllocation" }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/AdvanceRefund" }
        entry_id: { type: string, format: uuid, description: The journal entry that booked the payment. }
        void_reason: { type: string, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PaymentVoid:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }

    PaymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        next_cursor: { type: string, nullable: true }

    DueItem:
      type: object
      required: [challan_id, student_id, challan_no, month, due_date, total, paid, balance]
      properties:
        challan_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        challan_no: { type: integer, format: int64 }
        month: { type: string, format: date }
        due_date: { type: string, format: date }
        total: { $ref: "#/components/schemas/Money" }
        paid: { $ref: "#/components/schemas/Money" }
        balance: { $ref: "#/components/schemas/Money" }

    FamilyDues:
      type: object
      required: [family_id, total_due, advance_available, items]
      properties:
        family_id: { type: string, format: uuid }
        total_due: { $ref: "#/components/schemas/Money" }
        advance_available: { $ref: "#/components/schemas/Money" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DueItem" }

    PaymentProgress:
      type: string
      description: For a released challan, how much of it has been paid. Null for drafts and voided challans.
      enum: [unpaid, partial, paid]

    AdvanceRefundCreate:
      type: object
      required: [amount, account_code, reason]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        account_code: { $ref: "#/components/schemas/PaymentAccount" }
        reason: { type: string, minLength: 3, maxLength: 200 }

    AdvanceRefund:
      type: object
      required: [id, amount, account_code, reason, entry_id, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        account_code: { $ref: "#/components/schemas/PaymentAccount" }
        reason: { type: string }
        entry_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    FeePayer:
      type: object
      required: [name, mobile, relationship]
      properties:
        name: { type: string }
        mobile: { type: string }
        relationship: { type: string }

    Defaulter:
      type: object
      required: [family_id, overdue_total, oldest_due_date, days_overdue, challans]
      properties:
        family_id: { type: string, format: uuid }
        overdue_total: { $ref: "#/components/schemas/Money" }
        oldest_due_date: { type: string, format: date }
        days_overdue: { type: integer, description: Days since the oldest overdue challan fell due. }
        fee_payer:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FeePayer"
        challans:
          type: array
          items: { $ref: "#/components/schemas/DueItem" }

    DefaulterPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Defaulter" }
        next_cursor: { type: string, nullable: true }

    AttendanceStatus:
      type: string
      description: |
        `left` appears only on a submitted register, for a student who moved to another section or withdrew
        that day; they are not counted anywhere.
      enum: [present, absent, late, leave, left]

    MarkStatus:
      type: string
      description: The statuses a person can set.
      enum: [present, absent, late, leave]

    RegisterStatus:
      type: string
      enum: [open, submitted]

    CalendarKind:
      type: string
      enum: [holiday, working]

    CalendarDay:
      type: object
      required: [id, date, kind, name, status]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        kind: { $ref: "#/components/schemas/CalendarKind" }
        name: { type: string }
        status: { type: string, enum: [active, removed] }

    CalendarDayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CalendarDay" }

    Calendar:
      type: object
      required: [weekly_off_days, from, to, days]
      properties:
        weekly_off_days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          description: The active entries in the range.
          items: { $ref: "#/components/schemas/CalendarDay" }

    WeeklyOffSet:
      type: object
      required: [days]
      properties:
        days:
          type: array
          maxItems: 6
          items: { type: integer, minimum: 0, maximum: 6 }

    CalendarDaysCreate:
      type: object
      required: [from, kind, name]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: Last date (inclusive); omit for one day. At most 60 dates. }
        kind: { $ref: "#/components/schemas/CalendarKind" }
        name: { type: string, minLength: 1, maxLength: 80 }

    AttendanceSettings:
      type: object
      required: [register_due_time, edit_window_days, low_attendance_percent]
      description: The responses always carry every field; on a request the three shift fields may be left out and keep their saved values.
      properties:
        morning_start:
          type: string
          example: "08:00"
          description: HH:MM in Asia/Karachi. When the morning shift starts.
        evening_start:
          type: string
          example: "13:00"
          description: HH:MM in Asia/Karachi. When the evening shift starts.
        late_after_minutes:
          type: integer
          minimum: 0
          maximum: 120
          description: A gate scan later than the shift's start plus this many minutes is late.
        register_due_time:
          type: string
          example: "10:00"
          description: HH:MM in Asia/Karachi. A register not submitted by then is reported missing.
        edit_window_days:
          type: integer
          minimum: 1
          maximum: 90
          description: How many days back `attendance.edit_within_window` may correct a submitted register.
        low_attendance_percent:
          type: integer
          minimum: 1
          maximum: 100

    RegisterOpen:
      type: object
      required: [section_id, date]
      properties:
        section_id: { type: string, format: uuid }
        date: { type: string, format: date }

    AttendanceRecord:
      type: object
      required: [student_id, registration_no, full_name, status, method, version, corrected]
      properties:
        student_id: { type: string, format: uuid }
        registration_no: { type: string }
        full_name: { type: string }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
        method: { type: string, enum: [prefill, manual, correction] }
        version: { type: integer, description: 1 for the first entry; each change adds one. }
        corrected: { type: boolean, description: True when changed after the register was submitted. }
        gate_arrived_at: { type: string, format: date-time, nullable: true, description: The student's first gate scan that day, if any. }
        gate_status: { type: string, enum: [present, late], nullable: true, description: How the gate classed that arrival. }

    RegisterCounts:
      type: object
      required: [students, present, absent, late, leave]
      properties:
        students: { type: integer, description: Students on the register who are counted (not those who left). Leave is included here. }
        present: { type: integer }
        absent: { type: integer }
        late: { type: integer }
        leave: { type: integer }

    Register:
      type: object
      required: [id, section_id, date, status, counts, records]
      properties:
        id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        section_name: { type: string }
        date: { type: string, format: date }
        status: { $ref: "#/components/schemas/RegisterStatus" }
        submitted_at: { type: string, format: date-time, nullable: true }
        counts: { $ref: "#/components/schemas/RegisterCounts" }
        records:
          type: array
          items: { $ref: "#/components/schemas/AttendanceRecord" }

    RegisterBrief:
      type: object
      required: [id, section_id, section_name, date, status, counts]
      properties:
        id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        section_name: { type: string }
        date: { type: string, format: date }
        status: { $ref: "#/components/schemas/RegisterStatus" }
        submitted_at: { type: string, format: date-time, nullable: true }
        counts: { $ref: "#/components/schemas/RegisterCounts" }

    RegisterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RegisterBrief" }

    RecordMark:
      type: object
      required: [student_id, status]
      properties:
        student_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MarkStatus" }

    RecordsMark:
      type: object
      required: [marks]
      properties:
        marks:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/RecordMark" }

    RecordCorrection:
      type: object
      required: [student_id, status, reason]
      properties:
        student_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MarkStatus" }
        reason: { type: string, minLength: 3, maxLength: 200 }

    MissingRegister:
      type: object
      required: [section_id, section_name]
      properties:
        section_id: { type: string, format: uuid }
        section_name: { type: string }
        has_open_register: { type: boolean, description: A register was opened but never submitted. }

    MissingRegisters:
      type: object
      required: [date, school_day, due_time, overdue, items]
      properties:
        date: { type: string, format: date }
        school_day: { type: boolean }
        due_time: { type: string }
        overdue: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/MissingRegister" }

    SectionDay:
      type: object
      required: [section_id, section_name, submitted, counts]
      properties:
        section_id: { type: string, format: uuid }
        section_name: { type: string }
        submitted: { type: boolean }
        counts: { $ref: "#/components/schemas/RegisterCounts" }

    DailySummary:
      type: object
      required: [date, school_day, totals, sections]
      properties:
        date: { type: string, format: date }
        school_day: { type: boolean }
        totals: { $ref: "#/components/schemas/RegisterCounts" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SectionDay" }

    AbsentContact:
      type: object
      required: [name, mobile, relationship]
      properties:
        name: { type: string }
        mobile: { type: string }
        relationship: { type: string }

    AbsentStudent:
      type: object
      required: [student_id, registration_no, full_name, section_id, section_name]
      properties:
        student_id: { type: string, format: uuid }
        registration_no: { type: string }
        full_name: { type: string }
        section_id: { type: string, format: uuid }
        section_name: { type: string }
        contact:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AbsentContact"

    AbsentList:
      type: object
      required: [date, items]
      properties:
        date: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/AbsentStudent" }

    AttendanceTotals:
      type: object
      required: [present, late, absent, leave, expected_days, percent]
      properties:
        present: { type: integer }
        late: { type: integer }
        absent: { type: integer }
        leave: { type: integer }
        expected_days: { type: integer, description: present + late + absent; leave is excused. }
        percent: { type: number, description: "(present + late) / expected_days, as a percentage with one decimal; 100 when there are no expected days." }

    LowAttendanceItem:
      type: object
      required: [student_id, registration_no, full_name, totals]
      properties:
        student_id: { type: string, format: uuid }
        registration_no: { type: string }
        full_name: { type: string }
        totals: { $ref: "#/components/schemas/AttendanceTotals" }

    LowAttendanceList:
      type: object
      required: [from, to, threshold, items]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        threshold: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/LowAttendanceItem" }

    StudentDay:
      type: object
      required: [date, section_id, status, method, corrected]
      properties:
        date: { type: string, format: date }
        section_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
        method: { type: string }
        corrected: { type: boolean }

    StudentAttendance:
      type: object
      required: [student_id, from, to, totals, days]
      properties:
        student_id: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: "#/components/schemas/AttendanceTotals" }
        days:
          type: array
          items: { $ref: "#/components/schemas/StudentDay" }

    StudentCard:
      type: object
      required: [id, student_id, status, issued_at]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        status: { type: string, enum: [active, disabled] }
        code:
          type: string
          nullable: true
          description: What the QR holds. Present for the active card only. Treat it as a credential.
        issued_at: { type: string, format: date-time }
        disabled_at: { type: string, format: date-time, nullable: true }
        disabled_reason: { type: string, nullable: true }

    StudentCardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StudentCard" }

    CardDisable:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }

    ScanCreate:
      type: object
      required: [code]
      properties:
        code: { type: string, description: The text read from the card's QR. }
        scanned_at:
          type: string
          format: date-time
          description: When the card was scanned, for an offline computer uploading later. Within the last 24 hours. Defaults to now.
        client_scan_id:
          type: string
          format: uuid
          description: Chosen by the scanning computer. Sending the same id again is safe and returns the same result.

    ScanStudent:
      type: object
      required: [id, registration_no, full_name, section_name]
      properties:
        id: { type: string, format: uuid }
        registration_no: { type: string }
        full_name: { type: string }
        section_name: { type: string }

    ScanResult:
      type: object
      required: [outcome, status, scanned_at, arrival_at, student]
      properties:
        outcome: { type: string, enum: [accepted, duplicate] }
        status: { type: string, enum: [present, late], description: The student's arrival status for the day. }
        scanned_at: { type: string, format: date-time }
        arrival_at: { type: string, format: date-time, description: The student's first scan of the day. }
        student: { $ref: "#/components/schemas/ScanStudent" }

    GateScan:
      type: object
      required: [id, student_id, registration_no, full_name, section_id, section_name, scanned_at, status, is_arrival]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        registration_no: { type: string }
        full_name: { type: string }
        section_id: { type: string, format: uuid }
        section_name: { type: string }
        scanned_at: { type: string, format: date-time }
        status: { type: string, enum: [present, late] }
        is_arrival: { type: boolean }

    GateScanList:
      type: object
      required: [date, items]
      properties:
        date: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/GateScan" }

    Mismatch:
      type: object
      required: [student_id, registration_no, full_name, section_id, section_name, kind, register_status]
      properties:
        student_id: { type: string, format: uuid }
        registration_no: { type: string }
        full_name: { type: string }
        section_id: { type: string, format: uuid }
        section_name: { type: string }
        kind: { type: string, enum: [scanned_but_absent, present_but_not_scanned] }
        register_status: { $ref: "#/components/schemas/AttendanceStatus" }
        gate_arrived_at: { type: string, format: date-time, nullable: true }

    MismatchList:
      type: object
      required: [date, items]
      properties:
        date: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/Mismatch" }
