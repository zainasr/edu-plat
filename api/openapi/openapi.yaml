openapi: 3.0.3
info:
  title: Education Platform API
  version: 0.8.1
  description: Source of truth for every capability (DEC-004). Edit this first, then the code.
# Infrastructure endpoints (health) sit at the root for the load balancer.
# Product endpoints carry their version in the path, for example /api/v1/students.
servers:
  - url: /

tags:
  - name: system
  - name: auth
  - name: tokens
  - name: students
  - name: structure
  - name: ledger
  - name: fees
  - name: staff

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a one-time code to a mobile number
      description: Always answers 202 for a well-formed number, so the response does not reveal which numbers are registered (REQ-IAM-010).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "202":
          description: Code issued (if the number is known)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpRequested" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Exchange a one-time code for a session token in one tenant
      description: |
        The session belongs to one tenant (tenant_slug). The caller must be a member
        of that tenant. Failures return the same error, so a wrong code, an unknown
        number and a non-member look identical (US-IAM-003).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerify" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "423": { $ref: "#/components/responses/OtpLocked" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/tokens:
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a personal access token for scripts and terminal use
      description: The token value is returned once. Only its hash is stored (REQ-IAM-015).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students:
    post:
      operationId: createStudent
      tags: [students]
      summary: Enrol a student with at least one guardian
      description: |
        Requires `student.create`. A guardian whose mobile already exists in the
        tenant joins that guardian's family (REQ-STU-004). Exactly one guardian is
        `primary`; when no guardian is `fee_payer`, the primary pays (BR-STU-006).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentCreate" }
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listStudents
      tags: [students]
      summary: List students in the caller's tenant (cursor paginated)
      description: Requires `student.view`. Results are ordered newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Read one student with guardians
      description: Requires `student.view`. A student outside the caller's tenant returns 404, never 403 (API conventions §3).
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/change-section:
    post:
      operationId: changeStudentSection
      tags: [students]
      summary: Move a student to another section, keeping history
      description: |
        Requires `student.edit`. Closes the current enrolment and opens a new one in the
        target section, recording the reason (US-STU-005, REQ-STU-008). Attendance and other
        history stay with the student. Moving to the same section, or to an archived one, is refused.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSection" }
      responses:
        "200":
          description: The student with the new enrolment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/enrolments:
    get:
      operationId: listStudentEnrolments
      tags: [students]
      summary: The enrolment history of one student, newest first
      description: Requires `student.view`. Every class, section or shift change is an entry (REQ-STU-008).
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sessions:
    post:
      operationId: createSession
      tags: [structure]
      summary: Create an academic session (year)
      description: |
        Requires `session.manage`. The first session of a branch becomes current. Later sessions
        are created not current; switch with make-current (BR-ORG-001, REQ-ORG-006).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSessionCreate" }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listSessions
      tags: [structure]
      summary: List the sessions of the tenant's branch, newest first
      description: Requires `org.view`.
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSessionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sessions/{sessionId}/make-current:
    post:
      operationId: makeSessionCurrent
      tags: [structure]
      summary: Make this session the current one
      description: Requires `session.manage`. The previous current session stops being current in the same transaction (BR-ORG-001).
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The session, now current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/classes:
    post:
      operationId: createClass
      tags: [structure]
      summary: Create a class (for example Class 5)
      description: Requires `org.manage`. The grade level orders classes and maps promotions (REQ-ORG-008).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassCreate" }
      responses:
        "201":
          description: Class created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listClasses
      tags: [structure]
      summary: List the classes, ordered by grade level
      description: Requires `org.view`.
      responses:
        "200":
          description: The classes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/classes/{classId}/archive:
    post:
      operationId: archiveClass
      tags: [structure]
      summary: Archive a class; it is never deleted
      description: Requires `org.manage`. Business records are archived, not deleted (BR-ORG-003, DEC-011). New enrolments into its sections are refused.
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The archived class
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sections:
    post:
      operationId: createSection
      tags: [structure]
      summary: Create a section of a class, in a shift
      description: |
        Requires `org.manage`. A shift is a property of a section: "5-A Morning" and "5-A Evening"
        are different sections (REQ-ORG-005).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionCreate" }
      responses:
        "201":
          description: Section created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listSections
      tags: [structure]
      summary: List sections, optionally of one class
      description: Requires `org.view`.
      parameters:
        - name: class_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sections/{sectionId}/archive:
    post:
      operationId: archiveSection
      tags: [structure]
      summary: Archive a section; it is never deleted
      description: Requires `org.manage`. Students already enrolled stay enrolled; new enrolments are refused (BR-ORG-003).
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The archived section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts:
    get:
      operationId: listLedgerAccounts
      tags: [ledger]
      summary: List the school's ledger accounts
      description: |
        Requires `ledger.view`. The built-in chart is created the first time money is posted, so a
        school that has never posted money lists none.
      responses:
        "200":
          description: The accounts, ordered by code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerAccountList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/journal-entries:
    get:
      operationId: listJournalEntries
      tags: [ledger]
      summary: List journal entries, newest first
      description: |
        Requires `ledger.view`. There is no endpoint that creates or changes an entry: money is
        posted only by fee and accounting actions, and a correction is a reversing entry
        (DEC-011, DEC-016).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of entries with their lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/journal-entries/{entryId}:
    get:
      operationId: getJournalEntry
      tags: [ledger]
      summary: Read one journal entry with its lines
      description: Requires `ledger.view`. An entry outside the caller's tenant is a 404.
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/reports/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [ledger]
      summary: Debit and credit totals per account up to a date
      description: |
        Requires `report.finance.view`. Total debits always equal total credits when the ledger is
        sound; `balanced` shows it so a person can see it.
      parameters:
        - name: as_of
          in: query
          required: false
          description: Include entries dated on or before this day. Defaults to today (Asia/Karachi).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The trial balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalance" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-types:
    post:
      operationId: createFeeType
      tags: [fees]
      summary: Add a fee type (a head such as Tuition or Transport)
      description: Requires `fee.settings`. Fee types are archived, never deleted (DEC-011).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeTypeCreate" }
      responses:
        "201":
          description: Fee type created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeType" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listFeeTypes
      tags: [fees]
      summary: List fee types, creating the suggested set the first time
      description: |
        Requires `fee.view`. A school starts with suggested types (Tuition, Admission, Registration,
        Annual, Transport, Security Deposit). They are suggestions, never locks: archive what you do
        not use. An archived suggestion is not recreated.
      responses:
        "200":
          description: The fee types, ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeTypeList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-types/{feeTypeId}/archive:
    post:
      operationId: archiveFeeType
      tags: [fees]
      summary: Archive a fee type
      description: |
        Requires `fee.settings`. An archived type cannot be added to a plan and drops out of the
        fee structure from now on; past plan versions and released challans keep it.
      parameters:
        - name: feeTypeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The archived fee type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeType" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-plans/{classId}/lines:
    post:
      operationId: setFeePlanLine
      tags: [fees]
      summary: Set (or remove) one fee type on a class plan, from a month
      description: |
        Requires `fee.plan.manage`. This adds a new effective-dated version; the previous version
        stays, so history is exact and a released challan is never altered (BR-FEE-001).
        Setting the same fee type for the same month twice is a 409: choose a later month.
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanLineSet" }
      responses:
        "201":
          description: The version that was added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLine" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-plans/{classId}:
    get:
      operationId: getFeePlan
      tags: [fees]
      summary: The class plan as it stands in a month
      description: |
        Requires `fee.view`. For each fee type, the latest version on or before the month, leaving
        out types that were removed or archived.
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          description: Any date in the month. Defaults to the current month (Asia/Karachi).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The plan for that month
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeePlan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/fee-plans/{classId}/history:
    get:
      operationId: getFeePlanHistory
      tags: [fees]
      summary: Every version ever set on a class plan, newest first
      description: Requires `fee.view`. Plan changes are audited and never overwrite earlier versions (REQ-FEE-001).
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: All versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLineList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/fee-overrides:
    post:
      operationId: setFeeOverride
      tags: [fees]
      summary: Set (or clear) one student's amount for a fee type, from a month
      description: |
        Requires `fee.plan.manage`. The fee type must be on the student's class plan in that month.
        A zero amount is allowed (a full concession). Like plan lines, this adds a version.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideSet" }
      responses:
        "201":
          description: The version that was added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeOverride" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listFeeOverrides
      tags: [fees]
      summary: Every override version set for a student, newest first
      description: Requires `fee.view`.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeOverrideList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/fee-structure:
    get:
      operationId: getFeeStructure
      tags: [fees]
      summary: What this student is charged for a month
      description: |
        Requires `fee.view`. The student's class plan for the month, with the student's overrides on
        top. Each line carries its frequency; challan generation decides which lines fall due.
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          description: Any date in the month. Defaults to the current month (Asia/Karachi).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The fee structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeStructure" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/generate:
    post:
      operationId: generateChallans
      tags: [fees]
      summary: Draft the month's challans for every billable student (or preview them)
      description: |
        Requires `fee.generate`. For each student with an active enrolment, builds a draft challan from
        the fee structure for `month`: monthly lines always, one-time lines in the month of the student's
        first enrolment, annual lines in the month of year the plan line first took effect, ad hoc lines
        never. A student who already has a non-void challan for the month is skipped ("has_challan"), so
        running it again is safe. With `dry_run` nothing is written and each student shows whether a
        challan "will_generate". Drafts post nothing to the ledger; release does.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateChallans" }
      responses:
        "200":
          description: What was (or would be) generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateChallansResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/release:
    post:
      operationId: releaseChallans
      tags: [fees]
      summary: Release draft challans in bulk
      description: |
        Requires `fee.release`. All or nothing. Each challan gets a gapless challan number and a consumer
        number, becomes read-only for ever (BR-FEE-001), and posts its receivable in the same transaction:
        debit Fee Receivable, credit Fee Income (BR-FEE-008). A challan that is not a draft makes the
        whole request fail with `challans.not_draft`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseChallans" }
      responses:
        "200":
          description: The released challans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallanList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans:
    get:
      operationId: listChallans
      tags: [fees]
      summary: List challans (cursor paginated, newest first)
      description: Requires `fee.view`.
      parameters:
        - name: month
          in: query
          required: false
          description: Any date in the month to list.
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ChallanStatus" }
        - name: student_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of challans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallanPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/{challanId}:
    get:
      operationId: getChallan
      tags: [fees]
      summary: One challan with its lines
      description: Requires `fee.view`.
      parameters:
        - name: challanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The challan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/challans/{challanId}/void:
    post:
      operationId: voidChallan
      tags: [fees]
      summary: Void a draft challan
      description: |
        Requires `fee.generate`. Drafts only; the student can then be generated again. A released
        challan is never edited or voided here (BR-FEE-001): its void is a ledger reversal and comes
        with payments.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: challanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoidChallan" }
      responses:
        "200":
          description: The voided challan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challan" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [staff]
      summary: The built-in roles and the permissions each one grants
      description: Requires `user.view`.
      responses:
        "200":
          description: The roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff:
    post:
      operationId: createStaff
      tags: [staff]
      summary: Add a staff member to the school
      description: |
        Requires `user.manage` and, because it gives roles, `role.manage`; giving the `owner` role also needs the caller to be an owner. The person is
        identified by mobile number. If that number already belongs to someone (even in another school) the
        same person is added here, and nothing in the response says so. The name given is this school's
        name for them. Starting roles are required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreate" }
      responses:
        "201":
          description: The staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listStaff
      tags: [staff]
      summary: List the school's staff
      description: Requires `user.view`. Ordered by name.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/StaffStatus" }
      responses:
        "200":
          description: The staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}:
    get:
      operationId: getStaff
      tags: [staff]
      summary: One staff member with their current roles
      description: Requires `user.view`.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/roles:
    post:
      operationId: assignRole
      tags: [staff]
      summary: Give a staff member a role
      description: |
        Requires `role.manage`; the `owner` role can be given only by an owner. A person may hold many
        roles and their permissions are the union (REQ-IAM-002). Giving a role they already hold is a 409.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAssign" }
      responses:
        "200":
          description: The staff member with the new role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/roles/{role}/revoke:
    post:
      operationId: revokeRole
      tags: [staff]
      summary: Take a role away from a staff member
      description: |
        Requires `role.manage`; the `owner` role can be revoked only by an owner, and never from the last
        owner (`staff.last_owner`). The assignment is kept as history (REQ-IAM-006). Taking a person's last role
        switches them off, as deactivation does (REQ-IAM-006); it cannot be your own last role.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
        - name: role
          in: path
          required: true
          schema: { $ref: "#/components/schemas/RoleName" }
      responses:
        "200":
          description: The staff member without that role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/deactivate:
    post:
      operationId: deactivateStaff
      tags: [staff]
      summary: Switch a staff member off
      description: |
        Requires `user.manage` (an owner is switched off only by an owner). Access ends on their next request and their tokens are revoked; their
        history stays (US-IAM-005). You cannot deactivate yourself, nor the last owner.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The deactivated staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/{staffId}/reactivate:
    post:
      operationId: reactivateStaff
      tags: [staff]
      summary: Switch a deactivated staff member back on
      description: |
        Requires `user.manage`. Their roles are as they were; they sign in again, since their old tokens
        stay revoked.
      parameters:
        - name: staffId
          in: path
          required: true
          description: The id of the staff member (their membership in this school).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-chosen unique string (8 to 128 characters: letters, digits, `.`, `_`, `:`, `-`) that makes
        a retry safe (REQ-API-010). The key belongs to the user who first sent it, for one endpoint and one
        exact request (path, query and body). A repeat of that request returns the original successful
        response (header `Idempotent-Replay: true`; only the status, body and Content-Type are replayed)
        and does nothing again. The same key with anything different, including another user, is refused
        with 422 `idempotency.key_reused`. While the first request is still running a repeat gets 409
        `idempotency.in_progress`. Only successful responses (below 400) are remembered, for 24 hours; an
        error frees the key so the same request can be retried. Optional for now; payments will require it.
      schema: { type: string, minLength: 8, maxLength: 128 }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token (from verify) or personal access token (from /tokens).

  responses:
    ValidationError:
      description: Request is malformed or breaks a rule
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: Missing, unknown, expired or revoked token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidCredentials:
      description: Wrong or expired code, or the mobile is not a member of the tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    OtpLocked:
      description: Too many wrong codes; wait for the cool-down
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Token lacks the named permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: The request clashes with existing data, for example a duplicate name
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    KeyReused:
      description: The Idempotency-Key was already used with a different request body or endpoint
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such resource in the caller's tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Unexpected failure; the request_id is in the body and the logs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: student.not_found }
            message: { type: string, example: Student not found. }
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: guardians }
                  message: { type: string, example: At least one guardian is required. }
            request_id: { type: string, example: 3f1c2a9e0b7d4c11 }

    Mobile:
      type: string
      description: Pakistani mobile, as 03XXXXXXXXX or +923XXXXXXXXX. Stored as E.164.
      pattern: "^(\\+92|0)3[0-9]{9}$"
      example: "03001234567"

    OtpRequest:
      type: object
      required: [mobile]
      additionalProperties: false
      properties:
        mobile: { $ref: "#/components/schemas/Mobile" }

    OtpRequested:
      type: object
      required: [expires_in_seconds]
      properties:
        expires_in_seconds: { type: integer, example: 300 }

    OtpVerify:
      type: object
      required: [mobile, code, tenant_slug]
      additionalProperties: false
      properties:
        mobile: { $ref: "#/components/schemas/Mobile" }
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "123456"
        tenant_slug:
          type: string
          pattern: "^[a-z0-9-]{3,40}$"
          example: demo-school

    Session:
      type: object
      required: [token, expires_at, tenant]
      properties:
        token:
          type: string
          example: edu_session_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        expires_at: { type: string, format: date-time }
        tenant:
          $ref: "#/components/schemas/TenantRef"

    TenantRef:
      type: object
      required: [id, slug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: demo-school }

    TokenCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: nightly-import
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90

    TokenCreated:
      type: object
      required: [id, name, token, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token:
          type: string
          description: Shown once. Store it now.
          example: edu_pat_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        expires_at: { type: string, format: date-time }

    Gender:
      type: string
      enum: [male, female, other]

    Relationship:
      type: string
      description: A guardian's relation to the student (REQ-STU-002).
      enum: [father, mother, grandfather, grandmother, uncle, aunt, brother, sister, other]

    GuardianAccess:
      type: string
      enum: [full, view_only, none]

    GuardianInput:
      type: object
      required: [full_name, mobile, relationship, primary]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        mobile: { $ref: "#/components/schemas/Mobile" }
        relationship: { $ref: "#/components/schemas/Relationship" }
        primary: { type: boolean, description: The family login. Exactly one guardian is primary. }
        fee_payer: { type: boolean, description: Challans are addressed to this guardian. Defaults to the primary. }
        receives_notifications: { type: boolean, default: true }
        emergency_contact: { type: boolean, default: false }
        access: { $ref: "#/components/schemas/GuardianAccess", default: full }

    StudentCreate:
      type: object
      required: [full_name, father_name, gender, date_of_birth, section_id, guardians]
      additionalProperties: false
      properties:
        section_id:
          type: string
          format: uuid
          description: The section to enrol in, in the branch's current session (REQ-STU-001).
        full_name: { type: string, minLength: 1, maxLength: 120, example: Ali Khan }
        father_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Identity field for certificates. May be "Not available". The father need not be a guardian (REQ-STU-014).
          example: Imran Khan
        gender: { $ref: "#/components/schemas/Gender" }
        date_of_birth: { type: string, format: date, example: "2018-04-12" }
        guardians:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/GuardianInput" }

    GuardianView:
      type: object
      required: [guardian_id, full_name, mobile, relationship, primary, fee_payer, receives_notifications, emergency_contact, access]
      properties:
        guardian_id: { type: string, format: uuid }
        full_name: { type: string }
        mobile: { type: string }
        relationship: { $ref: "#/components/schemas/Relationship" }
        primary: { type: boolean }
        fee_payer: { type: boolean }
        receives_notifications: { type: boolean }
        emergency_contact: { type: boolean }
        access: { $ref: "#/components/schemas/GuardianAccess" }

    Student:
      type: object
      required: [id, registration_no, full_name, father_name, gender, date_of_birth, status, family, enrolment, guardians, created_at]
      properties:
        id: { type: string, format: uuid }
        enrolment:
          nullable: true
          description: The current enrolment. Null for a student who has none yet (for example one created before sections existed).
          allOf:
            - $ref: "#/components/schemas/Enrolment"
        registration_no: { type: string, example: "REG-2026-00001" }
        full_name: { type: string }
        father_name: { type: string }
        gender: { $ref: "#/components/schemas/Gender" }
        date_of_birth: { type: string, format: date }
        status:
          type: string
          enum: [active]
        family:
          type: object
          required: [id, number]
          properties:
            id: { type: string, format: uuid }
            number: { type: string, example: "F-00001" }
        guardians:
          type: array
          items: { $ref: "#/components/schemas/GuardianView" }
        created_at: { type: string, format: date-time }

    StudentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Student" }
        next_cursor:
          type: string
          nullable: true
          description: Pass as ?cursor= to get the next page. Null on the last page.

    Shift:
      type: string
      description: A shift is a property of a section (REQ-ORG-005).
      enum: [morning, evening]

    AcademicSessionCreate:
      type: object
      required: [name, starts_on, ends_on]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40, example: "2026-27" }
        starts_on: { type: string, format: date, example: "2026-04-01" }
        ends_on: { type: string, format: date, example: "2027-03-31" }

    AcademicSession:
      type: object
      required: [id, name, starts_on, ends_on, is_current]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        is_current: { type: boolean }

    AcademicSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AcademicSession" }

    ClassCreate:
      type: object
      required: [name, grade_level]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40, example: "Class 5" }
        grade_level:
          type: integer
          minimum: 0
          maximum: 16
          description: Orders classes and maps promotions. 0 is early years.

    Class:
      type: object
      required: [id, name, grade_level, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grade_level: { type: integer }
        status: { type: string, enum: [active, archived] }

    ClassList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Class" }

    SectionCreate:
      type: object
      required: [class_id, name, shift]
      additionalProperties: false
      properties:
        class_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 20, example: A }
        shift: { $ref: "#/components/schemas/Shift" }

    Section:
      type: object
      required: [id, class_id, class_name, name, shift, status]
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        class_name: { type: string }
        name: { type: string }
        shift: { $ref: "#/components/schemas/Shift" }
        status: { type: string, enum: [active, archived] }

    SectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Section" }

    ChangeSection:
      type: object
      required: [section_id, reason]
      additionalProperties: false
      properties:
        section_id: { type: string, format: uuid }
        reason:
          type: string
          minLength: 3
          maxLength: 200
          example: correction

    Enrolment:
      type: object
      required: [id, session_id, session_name, section_id, class_name, section_name, shift, status, started_on]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        session_name: { type: string }
        section_id: { type: string, format: uuid }
        class_name: { type: string }
        section_name: { type: string }
        shift: { $ref: "#/components/schemas/Shift" }
        status: { type: string, enum: [active, closed] }
        started_on: { type: string, format: date }
        ended_on: { type: string, format: date, nullable: true }
        reason: { type: string, nullable: true, description: Why the student moved (set when an enrolment is closed by a move). }

    EnrolmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Enrolment" }

    Money:
      type: object
      description: An amount in minor units (paisa). Never a decimal or a float (API conventions §2).
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Whole paisa. 150000 is PKR 1,500.00.
          example: 150000
        currency: { type: string, enum: [PKR], example: PKR }

    LedgerAccount:
      type: object
      required: [id, code, name, type, system]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: "1200" }
        name: { type: string, example: Fee Receivable }
        type: { type: string, enum: [asset, liability, income, expense, equity] }
        system: { type: boolean, description: Built-in accounts cannot be removed. }

    LedgerAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LedgerAccount" }

    JournalLine:
      type: object
      required: [line_no, account_code, account_name, debit, credit]
      properties:
        line_no: { type: integer }
        account_code: { type: string }
        account_name: { type: string }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }

    JournalEntry:
      type: object
      required: [id, entry_no, occurred_on, memo, source_type, lines, created_at]
      properties:
        id: { type: string, format: uuid }
        entry_no: { type: integer, format: int64, description: Consecutive per school, no gaps. }
        occurred_on: { type: string, format: date }
        memo: { type: string }
        source_type: { type: string, example: challan.released }
        source_id: { type: string, format: uuid, nullable: true }
        reverses_entry_id:
          type: string
          format: uuid
          nullable: true
          description: Set when this entry reverses another.
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLine" }
        created_at: { type: string, format: date-time }

    JournalEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JournalEntry" }
        next_cursor: { type: string, nullable: true }

    TrialBalanceLine:
      type: object
      required: [account_code, account_name, account_type, debit, credit]
      properties:
        account_code: { type: string }
        account_name: { type: string }
        account_type: { type: string }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }

    TrialBalance:
      type: object
      required: [as_of, lines, total_debit, total_credit, balanced]
      properties:
        as_of: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/TrialBalanceLine" }
        total_debit: { $ref: "#/components/schemas/Money" }
        total_credit: { $ref: "#/components/schemas/Money" }
        balanced: { type: boolean }

    FeeKind:
      type: string
      description: What a fee type is for. `security_deposit` is held for the family and is never income (BR-FEE-004).
      enum: [tuition, admission, registration, annual, transport, lab, library, sports, fine, security_deposit, custom]

    FeeFrequency:
      type: string
      description: How often a plan line is charged. Quarterly and term are 1.1 (REQ-FEE-002).
      enum: [monthly, one_time, annual, ad_hoc]

    FeeTypeCreate:
      type: object
      required: [code, name, kind]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,29}$"
          description: A short stable key, unique in the school.
          example: lab_fee
        name: { type: string, minLength: 1, maxLength: 60, example: Lab Fee }
        kind: { $ref: "#/components/schemas/FeeKind" }

    FeeType:
      type: object
      required: [id, code, name, kind, is_deposit, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        is_deposit: { type: boolean, description: True only for security deposits. }
        status: { type: string, enum: [active, archived] }

    FeeTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeeType" }

    PlanLineSet:
      type: object
      required: [fee_type_id, effective_from]
      additionalProperties: false
      properties:
        fee_type_id: { type: string, format: uuid }
        effective_from:
          type: string
          format: date
          description: Any date in the month the change starts. It is stored as the first of that month.
        remove:
          type: boolean
          default: false
          description: Take this fee type off the plan from that month. No amount or frequency is sent.
        amount:
          $ref: "#/components/schemas/Money"
        frequency:
          $ref: "#/components/schemas/FeeFrequency"

    PlanLine:
      type: object
      required: [fee_type_id, fee_type_name, effective_from, removed]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        amount: { $ref: "#/components/schemas/Money" }
        frequency: { $ref: "#/components/schemas/FeeFrequency" }
        effective_from: { type: string, format: date }
        removed: { type: boolean }

    PlanLineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanLine" }

    FeePlan:
      type: object
      required: [class_id, month, lines]
      properties:
        class_id: { type: string, format: uuid }
        month: { type: string, format: date, description: The first day of the month asked for. }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PlanLine" }

    OverrideSet:
      type: object
      required: [fee_type_id, effective_from, reason]
      additionalProperties: false
      properties:
        fee_type_id: { type: string, format: uuid }
        effective_from: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 200, example: sibling concession }
        clear:
          type: boolean
          default: false
          description: Go back to the class plan amount from that month. No amount is sent.
        amount:
          $ref: "#/components/schemas/Money"

    FeeOverride:
      type: object
      required: [fee_type_id, fee_type_name, effective_from, cleared, reason, created_at]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        effective_from: { type: string, format: date }
        cleared: { type: boolean }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    FeeOverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeeOverride" }

    FeeLine:
      type: object
      required: [fee_type_id, fee_type_name, kind, amount, plan_amount, frequency, source]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        amount: { $ref: "#/components/schemas/Money" }
        plan_amount: { $ref: "#/components/schemas/Money" }
        frequency: { $ref: "#/components/schemas/FeeFrequency" }
        source:
          type: string
          enum: [plan, override]
          description: Where `amount` came from.

    FeeStructure:
      type: object
      required: [student_id, class_id, month, lines]
      properties:
        student_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        month: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/FeeLine" }

    ChallanStatus:
      type: string
      enum: [draft, released, void]

    GenerateChallans:
      type: object
      required: [month]
      properties:
        month:
          type: string
          format: date
          description: Any date in the month to bill.
        due_date:
          type: string
          format: date
          description: Defaults to the 10th of the month. Must not be before the month starts.
        dry_run:
          type: boolean
          default: false

    GenerateOutcome:
      type: string
      enum: [will_generate, generated, has_challan, nothing_to_bill]

    GenerateItem:
      type: object
      required: [student_id, student_name, registration_no, outcome, new_admission, total]
      properties:
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        registration_no: { type: string }
        outcome: { $ref: "#/components/schemas/GenerateOutcome" }
        new_admission:
          type: boolean
          description: True when the month is the student's first enrolment month (for the review exceptions list).
        total: { $ref: "#/components/schemas/Money" }
        challan_id: { type: string, format: uuid, nullable: true }

    GenerateChallansResult:
      type: object
      required: [month, due_date, dry_run, generated, items]
      properties:
        month: { type: string, format: date }
        due_date: { type: string, format: date }
        dry_run: { type: boolean }
        generated: { type: integer, description: Number of drafts written (0 for a dry run). }
        items:
          type: array
          items: { $ref: "#/components/schemas/GenerateItem" }

    ReleaseChallans:
      type: object
      required: [challan_ids]
      properties:
        challan_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }

    VoidChallan:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 300 }

    ChallanLine:
      type: object
      required: [fee_type_id, fee_type_name, kind, frequency, amount]
      properties:
        fee_type_id: { type: string, format: uuid }
        fee_type_name: { type: string }
        kind: { $ref: "#/components/schemas/FeeKind" }
        frequency: { $ref: "#/components/schemas/FeeFrequency" }
        amount: { $ref: "#/components/schemas/Money" }

    Challan:
      type: object
      required: [id, student_id, family_id, month, due_date, status, new_admission, total, lines, created_at]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        month: { type: string, format: date }
        due_date: { type: string, format: date }
        status: { $ref: "#/components/schemas/ChallanStatus" }
        new_admission:
          type: boolean
          description: True when this is the month of the student's first enrolment. It marks an exception for the reviewer; it is worked out when the challan is read, not stored.
        total: { $ref: "#/components/schemas/Money" }
        challan_no:
          type: integer
          format: int64
          nullable: true
          description: Gapless, set at release.
        consumer_no:
          type: string
          nullable: true
          description: 14 digits, set at release (ADR-0017).
        lines:
          type: array
          items: { $ref: "#/components/schemas/ChallanLine" }
        released_at: { type: string, format: date-time, nullable: true }
        void_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ChallanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Challan" }

    ChallanPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Challan" }
        next_cursor: { type: string, nullable: true }

    RoleName:
      type: string
      enum: [owner, accountant, receptionist]

    StaffStatus:
      type: string
      enum: [active, deactivated]

    RoleInfo:
      type: object
      required: [name, permissions]
      properties:
        name: { $ref: "#/components/schemas/RoleName" }
        permissions:
          type: array
          items: { type: string }

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoleInfo" }

    StaffCreate:
      type: object
      required: [mobile, full_name, roles]
      properties:
        mobile: { type: string, example: "03001234567" }
        full_name: { type: string, minLength: 1, maxLength: 80 }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RoleName" }

    RoleAssign:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/RoleName" }

    StaffMember:
      type: object
      required: [id, mobile, full_name, status, roles, created_at]
      properties:
        id: { type: string, format: uuid, description: The staff member's id in this school. }
        mobile: { type: string, description: In +92 form. }
        full_name: { type: string }
        status: { $ref: "#/components/schemas/StaffStatus" }
        roles:
          type: array
          description: Current roles only; revoked ones are in the audit log.
          items: { $ref: "#/components/schemas/RoleName" }
        created_at: { type: string, format: date-time }

    StaffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StaffMember" }
