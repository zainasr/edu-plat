        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/absent:
    get:
      operationId: listAbsentToday
      tags: [attendance]
      summary: Students marked absent on a date, with a contact to call
      description: Requires `attendance.view`. Submitted registers only (BR-ATT-005). The guardian's name and mobile are included only for callers with `attendance.contacts`.
      parameters:
        - name: date
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The absent students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbsentList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/attendance/low:
    get:
      operationId: listLowAttendance
      tags: [attendance]
      summary: Students whose attendance is below a threshold over a period
      description: |
        Requires `attendance.view`. Attendance is (present + late) / (present + late + absent) over submitted
        registers; approved leave is excused and reported separately, not counted against the student.
        The threshold defaults to the school's setting (75%).
      parameters:
        - name: from
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Required; a missing value is a 400 `attendance.date_invalid` (checked after the permission).
          schema: { type: string, format: date }
        - name: threshold
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: The students below the threshold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LowAttendanceList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/students/{studentId}/attendance:
